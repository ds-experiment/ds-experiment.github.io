<!doctype html>
<html lang="en">
    <head>
        <title>Flat Expenses</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- OpenGraph Meta Tags -->
        <meta property="og:type" content="website">
        <meta property="og:image" content="https://ds-experiment.github.io/images/og_image.png">
        <meta property="og:title" content="Flat Expenses">
        <meta property="og:description" content="">

        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:image" content="https://ds-experiment.github.io/images/og_image.png">
        <meta name="twitter:title" content="Flat Expenses">
        <meta name="twitter:description" content="">

        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
        <meta http-equiv="Pragma" content="no-cache"/>
        <meta http-equiv="Expires" content="0"/>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" type="text/css" href="/css/index.css">
        <link rel="shortcut icon" type="image/png" href="/images/og_image.png">
    </head>
    <body>
        <div id="content_div" class="container">
            <div class="row my-5">
                <div class="col-md-12">
                    <table style="width: 100%;">
                        <thead>
                            <tr>
                                <th style="width: 30%;">
                                    Flat
                                </th>
                                <th>
                                    Amount
                                </th>
                            </tr>
                        </thead>
                        <tbody id="table_data">
                        </tbody>
                    </table>
                    <br/>
                    <div style="text-align: center;">
                        <button id="share_button" class="btn btn-success">
                            <span><i class="fa-brands fa-whatsapp"></i> Share</span>
                        </button>
                    </div>
                    <br/>
                </div>
            </div>
        </div>


        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-scrollTo/2.1.2/jquery.scrollTo.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
        <script>
            function calculate_sum()
            {
                let total = 0;
                document.querySelectorAll(".amount_input").forEach( element => {
                    let amount = parseInt(element.value);
                    if(isNaN(amount))
                    {
                        amount = 0;
                    }
                    total += amount;
                });
                $("#amount_total").html(total);
                return total;
            }

            let flat_list = ["1A", "1B", "2A", "2B", "3A", "3B", "4A", "4B", "5A", "5B", "6A", "6B"];
            
            let table_data_text = "";
            flat_list.forEach( flat => {
                table_data_text += `<tr><td>${flat}</td><td><input type="text" class="amount_input" flat="${flat}"/></td></tr>`;
            });
            table_data_text += `<tr><td>Total</td><td id="amount_total">0</td></tr>`;
            $("#table_data").html(table_data_text);

            $(".amount_input").keyup(function(){
                calculate_sum();
            });

            $("#share_button").click(() => {
                let total = calculate_sum();

                let message = "";
                document.querySelectorAll(".amount_input").forEach( element => {
                    let amount = parseInt(element.value);
                    if(isNaN(amount) == false && amount != 0)
                    {
                        message += `Flat ${element.getAttribute("flat")}: Rs ${amount}\n`;
                    };
                });

                if(total == 0 && message == "") // Total can be zero with negative entries. Hence checking both.
                {
                    alert("No entries to send!");
                    return;
                }

                message += `------------------------\n`;
                message += `Total: Rs ${total}`
                let whatsapp_url = `https://wa.me/?text=${encodeURIComponent(message)}`;
                window.open(whatsapp_url, "_blank");
            });
        </script>
    </body>
</html>
